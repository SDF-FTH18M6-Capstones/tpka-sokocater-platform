services:
    - type: web
    name: sokocater-backend
    env: python
    rootDir: backend
    buildCommand: "pip install -r requirements.txt && python seed.py"
    startCommand: "gunicorn app:app --bind 0.0.0.0:$PORT"
    envVars:
            - key: APP_ENV
        value: production
            - key: JWT_SECRET_KEY
        generateValue: true
            - key: DATABASE_URL
        fromDatabase:
          name: sokocater-db
          property: connectionString
            - key: CORS_ORIGINS
        value: "https://YOUR-VERCEL-URL.vercel.app"
            - key: PYTHON_VERSION
        value: 3.12.0
    plan: free

databases:
    - name: sokocater-db
    plan: free
